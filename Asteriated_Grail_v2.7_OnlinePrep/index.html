<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>Asteriated Grail｜陣容構築挑戰 v2.1 Offline</title>
<style>
:root{--bg:#091022;--panel:#121c38;--line:#33456d;--gold:#e7bd63;--gold2:#ffe3a6;--text:#f7f8ff;--muted:#9da9ca;--green:#91e4bd}
*{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC",sans-serif;background:radial-gradient(circle at 50% -15%,#293e73 0,transparent 38%),linear-gradient(180deg,#091022,#070c18)}
button{font:inherit} .app{max-width:1150px;margin:auto;padding:28px 18px 60px} header{text-align:center;margin-bottom:22px}
.eyebrow{color:var(--gold);font-size:13px;letter-spacing:.2em;font-weight:900} h1{font-size:clamp(28px,5vw,46px);margin:7px 0} header p{color:var(--muted);margin:0}
.panel{background:linear-gradient(180deg,rgba(20,31,61,.97),rgba(10,16,33,.98));border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.35)}
.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap} .round{font-size:22px;font-weight:950} .round span{color:var(--gold2)} .small{color:var(--muted);font-size:13px}
.offer-title{text-align:center;margin:25px 0 15px;color:var(--gold2);font-weight:900} .offers{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.card{border:1px solid #35466f;background:linear-gradient(180deg,#1b294d,#111a33);border-radius:18px;padding:12px 9px;color:white;cursor:pointer;transition:.16s;position:relative}
.card:hover{transform:translateY(-4px);border-color:var(--gold)} .card.selected{border-color:var(--gold);box-shadow:0 0 0 3px rgba(231,189,99,.12)}
.avatar{width:100px;height:100px;border-radius:50%;overflow:hidden;margin:auto;border:3px solid #52638e;background:#25365e} .avatar img,.mini img,.final-card img{width:100%;height:100%;object-fit:cover}
.name{font-weight:950;text-align:center;margin-top:8px} .stat{font-size:11px;color:#aeb9d8;text-align:center;margin-top:5px} .pickmark{position:absolute;right:8px;top:8px;display:none;background:var(--gold);color:#241b08;border-radius:50%;width:25px;height:25px;place-items:center;font-weight:1000} .selected .pickmark{display:grid}
.divider{height:1px;background:linear-gradient(90deg,transparent,#42537e,transparent);margin:26px 0} .seat-title{font-weight:900;margin-bottom:12px}
.seats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px} .seat{min-height:158px;border:1px dashed #46577d;border-radius:17px;padding:12px;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(5,9,20,.22)} .seat.available{border-color:var(--gold);cursor:pointer;background:rgba(231,189,99,.06)} .seat.available:hover{background:rgba(231,189,99,.12)} .seat.filled{border-style:solid}
.mini{width:74px;height:74px;border-radius:50%;overflow:hidden;margin:auto;border:2px solid #6576a3} .num{color:var(--gold);font-size:12px;font-weight:950} .sname{font-size:17px;font-weight:950;margin-top:6px} .instruction{text-align:center;min-height:28px;color:var(--gold2);font-weight:800;margin-top:17px}
.actions{display:flex;justify-content:center;gap:12px;margin-top:18px} .btn{border:0;border-radius:13px;padding:12px 22px;font-weight:950;cursor:pointer} .primary{background:linear-gradient(180deg,#ffe0a0,#dcae50);color:#231a08} .secondary{background:#263556;color:#f3f6ff;border:1px solid #50618d} .hidden{display:none!important}
.final-team{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px auto;max-width:680px} .final-card{border:1px solid #394b74;border-radius:15px;padding:11px;background:#151f3c;text-align:center} .final-card img{width:70px;height:70px;border-radius:50%;border:2px solid #697ba7}
.score-ring{width:190px;height:190px;border-radius:50%;margin:20px auto 14px;display:grid;place-items:center;position:relative;background:conic-gradient(var(--gold) var(--pct),#24304d 0)} .score-ring:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#101936} .score-number{position:relative;z-index:2;font-size:50px;font-weight:1000;color:var(--gold2)} .score-number small{font-size:19px;color:var(--muted)} .grade{font-size:28px;font-weight:1000;text-align:center} .feedback{max-width:720px;margin:10px auto;color:#c4cdec;line-height:1.7;text-align:center}
.breakdown{max-width:690px;margin:22px auto} .row{display:grid;grid-template-columns:125px 1fr 48px;gap:10px;align-items:center;margin:11px 0} .bar{height:9px;background:#25314d;border-radius:99px;overflow:hidden} .fill{height:100%;background:linear-gradient(90deg,#9ca9ca,#e7bd63)} .formula{max-width:760px;margin:18px auto 0;padding:13px;border-radius:12px;background:#0c142c;color:#8f9dbc;font-size:12px;line-height:1.6;text-align:center}
@media(max-width:760px){.offers{grid-template-columns:repeat(2,1fr)}.offers .card:last-child{grid-column:1/-1;max-width:50%;width:100%;justify-self:center}.seats,.final-team{grid-template-columns:1fr}}

.team-choice{display:flex;justify-content:center;gap:14px;margin:20px 0 6px;flex-wrap:wrap}
.team-btn{min-width:150px;padding:13px 24px;border-radius:14px;border:2px solid transparent;font-weight:950;cursor:pointer;color:#fff;transition:.16s}
.team-btn.red{background:linear-gradient(180deg,#7b2331,#43131d);border-color:#a94555}
.team-btn.blue{background:linear-gradient(180deg,#244d85,#122b50);border-color:#4d75ad}
.team-btn.active{box-shadow:0 0 0 3px rgba(255,255,255,.12),0 8px 22px rgba(0,0,0,.28);transform:translateY(-2px)}
.team-btn.red.active{border-color:#ff8b9e}.team-btn.blue.active{border-color:#79b6ff}
.team-note{text-align:center;color:#97a5c7;font-size:12px;margin-top:7px}
.table-wrap{margin-top:22px}.table-label{text-align:center;font-weight:900;color:var(--gold2);margin-bottom:12px}
.seat-map{position:relative;width:min(760px,92vw);aspect-ratio:1.18/1;margin:0 auto 26px}
.seat-orbit{position:absolute;inset:8% 8% 7%;border:10px solid rgba(231,189,99,.18);border-radius:50%}
.turn-arrow{position:absolute;left:45%;bottom:2.5%;font-size:38px;color:rgba(231,189,99,.72);transform:rotate(-8deg)}
.map-seat{position:absolute;width:118px;min-height:118px;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;text-align:center;border:3px solid;box-shadow:0 10px 24px rgba(0,0,0,.28);padding:8px;z-index:2}
.map-seat.red{background:linear-gradient(180deg,#762536,#40141e);border-color:#cf6677}
.map-seat.blue{background:linear-gradient(180deg,#26558f,#132e56);border-color:#6697d2}
.map-seat.mine{box-shadow:0 0 0 5px rgba(231,189,99,.25),0 10px 24px rgba(0,0,0,.3);border-color:var(--gold)}
.map-seat.available{cursor:pointer;animation:pulseSeat 1.5s ease-in-out infinite}.map-seat.available:hover{filter:brightness(1.15)}
.map-seat .seat-avatar{width:54px;height:54px;border-radius:50%;overflow:hidden;margin:0 auto 3px;border:2px solid rgba(255,255,255,.6)}
.map-seat .seat-avatar img{width:100%;height:100%;object-fit:cover}
.map-seat .seat-code{font-size:13px;font-weight:1000}.map-seat .seat-char{font-size:12px;font-weight:850;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:94px}
.first-tag{position:absolute;top:-13px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:3px 9px;border-radius:999px;background:#f1c86a;color:#281b05;font-size:9px;font-weight:1000;letter-spacing:.05em;border:2px solid #ffe7a6}
.map-seat.opp{opacity:.50;filter:saturate(.55)}.map-seat.opp .seat-char{color:#bbc4dd}
.pos-r1{left:73%;top:82%}.pos-b1{left:91%;top:50%}.pos-b2{left:73%;top:17%}.pos-r2{left:27%;top:17%}.pos-b3{left:9%;top:50%}.pos-r3{left:27%;top:82%}
.map-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36%;height:26%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #46577d;background:rgba(10,17,35,.84);text-align:center;padding:12px}
.map-center b{color:var(--gold2);font-size:18px}.map-center span{color:#8897bb;font-size:11px;margin-top:5px}
@keyframes pulseSeat{0%,100%{box-shadow:0 0 0 3px rgba(231,189,99,.18)}50%{box-shadow:0 0 0 8px rgba(231,189,99,.05)}}
@media(max-width:650px){.seat-map{width:96vw;margin-left:50%;transform:translateX(-50%);aspect-ratio:1/1}.map-seat{width:86px;min-height:86px;padding:5px}.map-seat .seat-avatar{width:40px;height:40px}.map-seat .seat-code{font-size:11px}.map-seat .seat-char{font-size:10px;max-width:70px}.first-tag{font-size:7px;padding:2px 5px}.seat-orbit{border-width:6px}.map-center{width:34%;height:24%}.map-center b{font-size:13px}.map-center span{font-size:9px}}


.profile-panel{max-width:980px;margin:0 auto 18px;padding:22px;border:1px solid #34466e;border-radius:18px;background:rgba(12,22,46,.94)}
.profile-panel h2{text-align:center;margin:0 0 6px;color:#f5d98c}
.profile-panel .sub{text-align:center;color:#9da9ca;font-size:13px;margin-bottom:18px}
.profile-name{display:flex;gap:10px;max-width:520px;margin:0 auto 18px}
.profile-name input{flex:1;background:#101a34;border:1px solid #40537e;border-radius:10px;color:#fff;padding:11px 13px;font-size:16px}
.favorite-title{text-align:center;font-weight:900;margin-bottom:10px}
.favorite-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:9px;max-height:390px;overflow:auto;padding:4px}
.favorite-card{border:1px solid #33466f;background:#15213f;border-radius:12px;color:#fff;padding:8px 5px;cursor:pointer;text-align:center}
.favorite-card img{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#26385f}
.favorite-card span{display:block;font-size:12px;margin-top:5px;font-weight:800}
.favorite-card.selected{border-color:#e7bd63;box-shadow:0 0 0 2px rgba(231,189,99,.18);background:#243052}
.profile-actions{text-align:center;margin-top:16px}
.player-score-title{text-align:center;font-size:17px;font-weight:900;color:#e7edf9;margin:14px auto 2px;line-height:1.55}
.history-wall{display:block;margin-top:8px;color:#d6b76c;font-weight:850}
.feedback.tier-gold,.feedback.tier-silver,.feedback.tier-bronze{display:block;width:fit-content;max-width:min(820px,90%);margin:8px auto 14px;padding:8px 18px 9px;border-radius:10px;line-height:1.45;text-align:center}
.feedback.tier-gold{color:#FFD76A;border:1.5px solid rgba(255,215,106,.82);background:rgba(255,215,106,.075);box-shadow:0 0 12px rgba(255,215,106,.13)}
.feedback.tier-silver{color:#F1F5FC;border:1.5px solid rgba(207,221,241,.78);background:rgba(207,221,241,.075);box-shadow:0 0 12px rgba(207,221,241,.12)}
.feedback.tier-bronze{color:#D99355;border:1.5px solid rgba(217,147,85,.82);background:rgba(217,147,85,.075);box-shadow:0 0 12px rgba(217,147,85,.12)}


.restart-actions{margin-bottom:0!important}
.restart-help{
  position:relative;
  display:block;
  clear:both;
  width:100%;
  box-sizing:border-box;
  text-align:center;
  color:#8f9bbb;
  font-size:11px;
  line-height:1.65;
  margin:10px auto 18px;
  padding:0 16px;

.bond-dialogue{

  background:linear-gradient(180deg,rgba(91,22,35,.96),rgba(50,17,28,.96));

}

  background:linear-gradient(180deg,rgba(18,48,88,.96),rgba(13,31,61,.96));

}
.final-card.team-red img{border-color:#d46a75}
.final-card.team-blue img{border-color:#5b8fce}
.final-card .team-seat-label{
  color:#f0c75b;
  font-size:18px;
  line-height:1;
  font-weight:1000;
  letter-spacing:.05em;
  margin-bottom:8px;
}


.mode-switch{display:flex;gap:10px;justify-content:center;margin:14px auto 12px;flex-wrap:wrap}
.mode-btn{border:1px solid #53678f;background:#18294a;color:#dce5fa;border-radius:12px;padding:10px 18px;font-weight:800;cursor:pointer}
.mode-btn.active{background:linear-gradient(180deg,#ffe09a,#e8b94f);color:#342307;border-color:#e9bc57}
.chain-config{max-width:600px;margin:8px auto 14px;padding:12px 14px;border:1px solid #334b76;border-radius:13px;background:rgba(9,20,42,.45)}
.chain-config.hidden{display:none}
.chain-config-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.chain-config select,.chain-config input{font-size:15px;padding:7px 9px;border-radius:8px;border:1px solid #53678f;background:#101f3d;color:#fff}
.chain-status{max-width:900px;margin:0 auto 13px;padding:10px 14px;border:1px solid #405986;border-radius:12px;background:rgba(8,18,38,.72);color:#d7e0f4;text-align:center}
.chain-status b{color:#f0c75b}
.chain-result{max-width:900px;margin:14px auto;padding:15px;border:1px solid #405986;border-radius:14px;background:rgba(8,18,38,.76)}
.chain-battle{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:12px 0}
.chain-side{padding:11px;border:1px solid #405986;border-radius:12px;text-align:center}
.chain-side.player{background:rgba(37,76,132,.18)}
.chain-side.cpu{background:rgba(121,45,62,.16)}
.chain-avatars{display:flex;justify-content:center;gap:6px;margin:7px 0}
.chain-avatars img{width:48px;height:48px;object-fit:cover;border-radius:50%;border:2px solid #6176a5}
.chain-score{font-size:32px;font-weight:1000;color:#ffe09a}
.chain-vs{font-weight:1000;color:#8795b8}
.chain-win{color:#f0c75b;font-weight:900}
.chain-lose{color:#ff91a3;font-weight:900}

.chain-history th{color:#f0c75b}

 .chain-battle{grid-template-columns:1fr;gap:6px}.chain-vs{display:none}
 .chain-history{overflow-x:auto}.chain-history table{min-width:560px}
}


.chain-opponent-msg{

  color:#ffb8c4;font-size:15px;font-weight:900;letter-spacing:.02em
}
.chain-trash{

  color:#cbd5ec;text-align:center
}

}

.chain-final-score{font-size:54px;font-weight:1000;color:#ffe09a;line-height:1}
.chain-final-grade{font-size:25px;font-weight:1000;color:#fff;margin-top:8px}

 .chain-opponent-msg{font-size:13px}

/* 6連選 V3：對方選角時固定版面，避免畫面跳動 */
#draftArea{position:relative}
#offers{
  min-height:170px;
  align-content:start;
}
#offers.cpu-waiting{
  pointer-events:none;
  opacity:.42;
  filter:saturate(.75);
}

  left:50%;
  transform:translateX(-50%);

  z-index:20;

  max-width:80%;
  padding:10px 16px;
  border:1px solid #5a6d95;
  border-radius:12px;
  background:rgba(7,16,31,.94);
  color:#f7f8ff;

.chain-top-status{position:absolute;right:18px;top:14px;z-index:5;padding:7px 10px;border:1px solid #405986;border-radius:10px;background:rgba(7,16,31,.78);color:#cbd5ec;font-size:12px;font-weight:800}
.chain-top-status b{color:#f0c75b}.chain-side.red{background:rgba(110,27,43,.25);border-color:#a84557}.chain-side.blue{background:rgba(24,67,119,.25);border-color:#3d78bc}
.chain-side .side-title{font-weight:900;color:#f7f8ff}.chain-side .side-result{font-size:12px;margin-top:4px;font-weight:900}.chain-side .side-result.win{color:#f0c75b}.chain-side .side-result.lose{color:#ff91a3}.chain-side .side-result.draw{color:#cbd5ec}
.chain-score-detail{font-size:11px;color:#8795b8;margin-top:4px}.chain-history .mini-team{display:flex;justify-content:center;gap:3px;min-width:112px}.chain-history .mini-team img{width:25px;height:25px;object-fit:cover;border-radius:50%;border:1px solid #60749e}

function matchNarrative(rec,index,total){

 const prefix=index===0?"首戰":index===1?"次戰":index===total-1?"最終戰":`第${index+1}戰`;
 if(rec.winner==="draw")return `${prefix}，你與${name}戰成平手。`;
 if(rec.winner==="player"){
   if(d>=20)return `${prefix}，你以壓倒性優勢擊潰了${name}。`;
   if(d>=10)return `${prefix}，你以高分輕取了${name}。`;
   if(d>=6)return `${prefix}，你穩健擊敗了${name}。`;
   return `${prefix}，你險勝了${name}。`;
 }
 if(d>=20)return `${prefix}，你遭到${name}大比分擊敗。`;
 if(d>=10)return `${prefix}，你不敵${name}。`;

}

function roundRect(ctx,x,y,w,h,r,fill,stroke,lineWidth=1){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.lineWidth=lineWidth;ctx.strokeStyle=stroke;ctx.stroke();}
}
function drawCenteredText(ctx,text,x,y,font,color){
  ctx.font=font;ctx.fillStyle=color;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text,x,y);
}
function fitText(ctx,text,maxWidth,startSize,minSize=14,weight=800){
  let size=startSize;
  while(size>minSize){
    ctx.font=`${weight} ${size}px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif`;
    if(ctx.measureText(text).width<=maxWidth)break;
    size--;
  }
  return `${weight} ${size}px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif`;
}
function wrapText(ctx,text,maxWidth){
  const chars=[...text], lines=[]; let line="";
  for(const ch of chars){
    const test=line+ch;
    if(line && ctx.measureText(test).width>maxWidth){lines.push(line);line=ch;} else line=test;
  }
  if(line)lines.push(line);
  return lines;
}


function imageProxyURL(url){ return url; }

function loadCanvasSafeImage(url){
  return new Promise(resolve=>{
    if(!url){resolve(null);return;}

    const tryLoad=(src,allowFallback)=>{
      const img=new Image();
      if(/^https?:/i.test(src)) img.crossOrigin="anonymous";
      img.onload=()=>{
        // Validate the image in a temporary canvas first.
        // do not contaminate the final result canvas.
        try{
          const t=document.createElement("canvas");
          t.width=4;t.height=4;
          const tc=t.getContext("2d");
          tc.drawImage(img,0,0,4,4);
          t.toDataURL("image/png");
          resolve(img);
        }catch(err){
          if(allowFallback) tryLoad(imageProxyURL(url),false);
          else resolve(null);
        }
      };
      img.onerror=()=>{
        if(allowFallback) tryLoad(imageProxyURL(url),false);
        else resolve(null);
      };
      img.src=src;
    };

    tryLoad(url,true);
  });
}

function drawCircularImage(ctx,img,cx,cy,r){
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.clip();

  const sw=img.naturalWidth||img.width;
  const sh=img.naturalHeight||img.height;
  const scale=Math.max((r*2)/sw,(r*2)/sh);
  const dw=sw*scale, dh=sh*scale;
  ctx.drawImage(img,cx-dw/2,cy-dh/2,dw,dh);
  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.lineWidth=3;
  ctx.strokeStyle="#687aa7";
  ctx.stroke();
}

function ensureChainAvatarData(src){
 return new Promise(resolve=>{
   if(!src){resolve(null);return;}
   if(window.__chainAvatarData[src]){resolve(window.__chainAvatarData[src]);return;}
   const js=chainAvatarManifest[src];
   if(!js){resolve(src);return;}
   if(chainAvatarLoadPromises[src]){
     chainAvatarLoadPromises[src].then(()=>resolve(window.__chainAvatarData[src]||src));
     return;
   }
   chainAvatarLoadPromises[src]=new Promise(done=>{
     const tag=document.createElement("script");
     tag.src=js;
     tag.onload=()=>done();
     tag.onerror=()=>done();
     document.head.appendChild(tag);
   });
   chainAvatarLoadPromises[src].then(()=>resolve(window.__chainAvatarData[src]||src));
 });
}

function loadChainImg(src){
 return new Promise(async resolve=>{
   if(!src){resolve(null);return;}
   const safeSrc=await ensureChainAvatarData(src);
   const img=new Image();
   img.onload=()=>resolve(img);
   img.onerror=()=>resolve(null);
   img.src=safeSrc;
 });
}
function drawRoundRect(ctx,x,y,w,h,r,fill,stroke,lineWidth=1){
 const rr=Math.min(r,w/2,h/2);
 ctx.beginPath();
 ctx.moveTo(x+rr,y);
 ctx.arcTo(x+w,y,x+w,y+h,rr);
 ctx.arcTo(x+w,y+h,x,y+h,rr);
 ctx.arcTo(x,y+h,x,y,rr);
 ctx.arcTo(x,y,x+w,y,rr);
 ctx.closePath();
 if(fill){ctx.fillStyle=fill;ctx.fill();}
 if(stroke){ctx.lineWidth=lineWidth;ctx.strokeStyle=stroke;ctx.stroke();}
}
function drawCircleAvatar(ctx,img,cx,cy,r,border="#6176a5"){

   ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
   const sw=img.naturalWidth||img.width,sh=img.naturalHeight||img.height;
   const sc=Math.max((r*2)/sw,(r*2)/sh),dw=sw*sc,dh=sh*sc;
   ctx.drawImage(img,cx-dw/2,cy-dh/2,dw,dh);ctx.restore();
 }
 ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.lineWidth=2;ctx.strokeStyle=border;ctx.stroke();
}
function wrapChainText(ctx,text,maxWidth){

 for(const ch of chars){

 }

      `你與${name}一路咬分，最後驚險過關`,
      `你在與${name}的硬仗中以毫釐之差取勝`,
      `你和${name}戰到最後，總算沒有把勝利送掉`,
      `你在與${name}的死鬥中驚險活到最後`
    ];
    const loseLines=[
      `你在與${name}的苦戰中以些微差距落敗`,
      `你在與${name}的鏖戰中最後惜敗`,
      `你與${name}火拼到最後，還是差了那麼一點`,
      `你在與${name}的激鬥中不幸落敗`,
      `你和${name}一路拉鋸，最後把勝利送了出去`,
      `你在與${name}的焦土戰中以毫釐之差殞落`,
      `你與${name}全面抗戰到最後，結果還是輸了`,
      `你在與${name}的對決中只差一步就能取勝`,
      `你和${name}打得難分難解，可惜最後不是你`,
      `你在與${name}的硬仗中被最後一擊帶走`,
      `你與${name}一路咬分，最後卻沒能守住`,
      `你在與${name}的死鬥中撐到最後仍然惜敗`,
      `你和${name}只差一點，偏偏就是這一點輸掉`,
      `你在與${name}的熱鬥中成功製造了一場遺憾`,
      `你差點就能擊敗${name}，可惜差點就是沒贏`
    ];
    if(win)winLines.push(...v21CloseWin.map(x=>agFillKusoTemplate(x,rec)));else loseLines.push(...v21CloseLose.map(x=>agFillKusoTemplate(x,rec)));
    return pick(win?winLines:loseLines);
  }

  if(d<=20){
    if(win)return pick([
      `你在與${name}的對戰中穩穩拿下勝利`,
      `你在與${name}的對決中成功克敵制勝`,
      `你面對${name}斬將破陣，勝得相當漂亮`,
      `你擊敗${name}取得大捷，整場表現相當扎實`
    ]);
    return pick([
      `你在與${name}的對戰中輸得相當完整`,
      `你在與${name}的對決中敗得乾脆`,
      `你面對${name}一路敗北，最後只能收拾殘局`,
      `你被${name}壓著打，想翻身都找不到位置`
    ]);
  }

  if(win)return pick([
    `你擊潰了${name}，這場勝利毫無懸念`,
    `你讓${name}連車尾燈都看不到`,
    `你贏得理直氣壯，${name}幾乎沒有還手空間`,
    `這不是取勝，是把${name}一路送回家`,
    `這分差大得像爸爸抽孩子，${name}只能認了`,
    ...v21BigWin.map(x=>agFillKusoTemplate(x,rec))
  ]);
  return pick([
    `你被${name}打得體無完膚`,
    `你輸得一塌糊塗，${name}甚至開始同情你`,
    `這場像個孩子被${name}好好教訓了一頓`,
    `${name}一路開走，你連車尾燈都看不到`,
    `你面對${name}毫無懸念地落敗`
  ]);
}

function specialIdentityGapLine(rec){
 const p=rec.player.map(c=>c.name), c=rec.cpu.map(c=>c.name);
 const pairs=[
  ["聖殿騎士","紅蓮騎士"],
  ["矜貴之女","聖女"]
 ];
 for(const [a,b] of pairs){
   const cross=(p.includes(a)&&c.includes(b))||(p.includes(b)&&c.includes(a));
   if(!cross)continue;
   const winnerTeam=rec.winner==="player"?p:(rec.winner==="cpu"?c:[]);
   if(!winnerTeam.length)return `這就是${a}跟${b}的差距嗎`;
   const loser=winnerTeam.includes(a)?b:a;
   const winner=winnerTeam.includes(a)?a:b;
   return `這就是${loser}跟${winner}的差距嗎`;
 }
 return "";
}


function comebackRoleLine(rec){

 const prevFive=new Set();
 chainHistory.slice(0,5).forEach(h=>{
   [...h.player,...h.cpu].forEach(c=>prevFive.add(c.name));
 });
 const newcomers=current.filter(n=>!prevFive.has(n));
 if(!newcomers.length||Math.random()>=0.50)return "";
 const role=newcomers[Math.floor(Math.random()*newcomers.length)];
 return `孩子們，我回來了——${role}`;
}

function chainAudienceLines(rec){

}

// V18 mobile image cache: reuse decoded images during result rendering.
const AGImageCache=new Map();
function agLoadImage(src){
  if(!src)return Promise.reject(new Error("empty image src"));
  if(AGImageCache.has(src))return AGImageCache.get(src);
  const p=new Promise((resolve,reject)=>{
    const im=new Image();
    im.decoding="async";
    im.onload=()=>resolve(im);
    im.onerror=reject;
    im.src=src;
  });
  AGImageCache.set(src,p);
  return p;
}
function agPreloadImages(list){
  [...new Set((list||[]).filter(Boolean))].forEach(src=>{ agLoadImage(src).catch(()=>{}); });
}
function agIsIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
}
